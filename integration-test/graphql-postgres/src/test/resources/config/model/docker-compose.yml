version: '3.9'

# This docker file is only used for local testing
services:
  postgres:
    image: postgis/postgis:11-3.1

    ports:
      - 5432:5432
    volumes:
      - ./20_schema.sql:/docker-entrypoint-initdb.d/20-schema.sql
      - ./30_data.sql:/docker-entrypoint-initdb.d/30-schema.sql
    environment:
      POSTGRES_DB: brewery
      POSTGRES_PASSWORD: postgres